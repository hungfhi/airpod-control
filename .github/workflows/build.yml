name: build-apk
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: 8.9 }
      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee build.log
      - name: Report errors as annotations
        if: failure()
        run: |
          grep -E '^e: |error:|ERROR' build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          awk '/What went wrong/{f=1} f{print; n++} n>12{exit}' build.log | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v5
        with:
          name: PodPopup-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases (link tải cố định)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PodPopup.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PodPopup.apk --title "PodPopup (bản mới nhất)" --notes "Build từ commit ${GITHUB_SHA::7}. Cài trực tiếp file PodPopup.apk trên điện thoại." --latest
